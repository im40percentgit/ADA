# Development overrides — automatically merged by docker compose.
#
# This file is loaded automatically when you run `docker compose up`
# without a -f flag. It adds development-specific settings:
#
#   - Ada source and config are bind-mounted read-only so code changes
#     are reflected without rebuilding the image (uvicorn --reload required).
#   - ADA_ENV=development loads config/development.toml for console logging.
#   - Explicit port bindings (same as production but documented here).
#
# For production deployment, use:
#   docker compose -f docker-compose.yml up

services:
  backend:
    volumes:
      # Bind-mount source for live reload — the named volume for data is
      # inherited from docker-compose.yml and still applies.
      - ./ada:/app/ada:ro
      - ./config:/app/config:ro
      - ada-data:/app/data
    environment:
      ADA_ENV: development
      ADA_LOGGING__FORMAT: console
    # In development, disable the health-check dependency so the backend
    # can be started independently without waiting for itself.
    # The override does NOT need to redeclare healthcheck — it inherits.

  web:
    environment:
      # Vite-served frontend in dev uses `npm run dev`, not `serve`.
      # This override keeps the production serve container but points it
      # at the same backend. For full hot-reload, run `npm run dev` locally
      # instead of using this container.
      NODE_ENV: development
