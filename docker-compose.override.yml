# Development overrides — automatically merged by docker compose.
#
# This file is loaded automatically when you run `docker compose up`
# without a -f flag. It adds development-specific settings:
#
#   - Ada source and config are bind-mounted read-only so code changes
#     are reflected without rebuilding the image (uvicorn --reload required).
#   - ADA_ENV=development loads config/development.toml for console logging.
#   - Backend port 8000 re-exposed for direct API access (bypassing Caddy).
#   - Caddy uses Caddyfile.dev (self-signed TLS via internal CA).
#
# For production deployment, use:
#   docker compose -f docker-compose.yml up

services:
  backend:
    ports:
      # Re-expose in dev for direct API testing without going through Caddy.
      - "8000:8000"
    volumes:
      # Bind-mount source for live reload — the named volume for data is
      # inherited from docker-compose.yml and still applies.
      - ./ada:/app/ada:ro
      - ./config:/app/config:ro
      - ada-data:/app/data
    environment:
      ADA_ENV: development
      ADA_LOGGING__FORMAT: console

  web:
    # In dev, web still does the one-shot copy into web-dist.
    # For full hot-reload, run `npm run dev` locally pointing at localhost:8000.
    environment:
      NODE_ENV: development

  caddy:
    volumes:
      # Override the Caddyfile with the dev variant (self-signed TLS, no ACME).
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - web-dist:/srv/web:ro
