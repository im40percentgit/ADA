[llm]
provider = "claude"
mode = "dual"
model = "claude-sonnet-4-6"
max_tokens = 1024
temperature = 0.7

[llm.claude]
api_key_env = "ANTHROPIC_API_KEY"

[llm.openai_compat]
base_url = "http://localhost:8080/v1"
api_key_env = "OPENAI_API_KEY"
model = "local-model"

[stt]
model_size = "large-v3-turbo"
language = "en"
compute_type = "int8"
min_confidence = 0.4
vad_filter = false
vad_threshold = 0.5

[tts]
enabled = false
provider = "kokoro"
voice_model = ""
sample_rate = 24000
sentence_streaming = true

[agents.wellness_companion]
enabled = true
timeout_seconds = 30.0

[agents.crisis_monitor]
enabled = true
timeout_seconds = 30.0

[agents.medication_manager]
enabled = true
timeout_seconds = 30.0

[agents.cognitive_assessor]
enabled = true
timeout_seconds = 30.0

[agents.daily_summary]
enabled = true
debounce_seconds = 1800.0
timeout_seconds = 60.0

[agents.board_suggestion]
enabled = true
debounce_seconds = 5.0
timeout_seconds = 30.0

[auth]
jwt_secret_env = "ADA_JWT_SECRET"
access_token_ttl_minutes = 30
refresh_token_ttl_days = 7

[api]
host = "0.0.0.0"
port = 8000
cors_origins = ["http://localhost:5173"]

[network]
bind_host = "127.0.0.1"
cors_origins = ["http://localhost:5173"]

[database]
path = "data/ada.db"

[logging]
level = "INFO"
format = "console"
request_id_header = "X-Request-ID"
access_log = true
slow_request_threshold_ms = 2000

[multimodal]
enabled = false
sensor_simulator_preset = "relaxed"
sensor_simulator_interval = 1.0
voice_analysis_enabled = true
face_analysis_enabled = true
physiological_analysis_enabled = true
physiological_window_size = 30
physiological_trigger_interval = 10
fusion_enabled = true
fusion_staleness_half_life = 10.0
fusion_min_weight = 0.01

[rate_limit]
enabled = true
auth_requests_per_minute = 10
api_requests_per_minute = 120
ws_connections_per_ip = 5

[security]
max_body_size_bytes = 1048576
max_media_body_size_bytes = 10485760
cors_allow_methods = ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
cors_allow_headers = ["Authorization", "Content-Type", "X-Request-ID", "X-Session-ID", "Accept", "Origin"]

[progress_report]
cache_ttl_seconds = 3600

[model_routing]
default_profile = "sonnet_tier"

[model_routing.profiles.opus_tier]
provider = "claude"
model = "claude-opus-4-7"
max_tokens = 2048
temperature = 0.3
api_key_env = "ANTHROPIC_API_KEY"
prompt_cache_system = true

[model_routing.profiles.sonnet_tier]
provider = "claude"
model = "claude-sonnet-4-6"
max_tokens = 1024
temperature = 0.7
api_key_env = "ANTHROPIC_API_KEY"

[model_routing.profiles.haiku_tier]
provider = "claude"
model = "claude-haiku-4-5-20251001"
max_tokens = 512
temperature = 0.4
api_key_env = "ANTHROPIC_API_KEY"

[model_routing.profiles.offline_tier]
provider = "openai_compat"
model = "local-model"
base_url = "http://localhost:8080/v1"
max_tokens = 2048
temperature = 0.7

[model_routing.agent_mapping]
# Opus tier — clinical reasoning (high accuracy, low volume)
cognitive_assessor   = "opus_tier"
crisis_monitor       = "opus_tier"
fusion               = "opus_tier"
session_summarizer   = "opus_tier"
# Sonnet tier — warm conversational + summaries
wellness_companion   = "sonnet_tier"
knowledge_agent      = "sonnet_tier"
daily_summary        = "sonnet_tier"
board_suggestion     = "sonnet_tier"
progress_report      = "sonnet_tier"
treatment_progress   = "sonnet_tier"
medication_manager   = "sonnet_tier"
# Haiku tier — high-volume, low-stakes
tts                  = "haiku_tier"
task_scoring         = "haiku_tier"
voice_emotion        = "haiku_tier"
facial_emotion       = "haiku_tier"
transcription        = "haiku_tier"
verdict              = "haiku_tier"
emotion_analyzer     = "haiku_tier"
physiological        = "haiku_tier"

[companion]
default_name = "Ada"
default_voice = "female"

[notifications]
enabled = true
vapid_private_key_env = "ADA_VAPID_PRIVATE_KEY"
vapid_public_key_env = "ADA_VAPID_PUBLIC_KEY"
vapid_email = "mailto:admin@ada.local"

[resilience.circuit_breaker]
failure_threshold = 5
failure_window_seconds = 60
recovery_timeout_seconds = 120

[retention]
session_data_days = 365
audit_log_days = 730
export_temp_days = 7
