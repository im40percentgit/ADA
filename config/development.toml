[llm]
provider = "openai_compat"
model = "crownelius/Crow-9B-Opus-4.6-Distill-Heretic_Qwen3.5:Q4_K_M"
max_tokens = 256
temperature = 0.7

[llm.claude]
api_key_env = "ANTHROPIC_API_KEY"

[llm.openai_compat]
base_url = "http://localhost:8080/v1"
api_key_env = "OPENAI_API_KEY"
model = "crownelius/Crow-9B-Opus-4.6-Distill-Heretic_Qwen3.5:Q4_K_M"

[agents.therapist]
enabled = true

[agents.crisis_monitor]
enabled = true

[api]
host = "127.0.0.1"
port = 8000
cors_origins = ["http://localhost:5173", "http://localhost:3000"]

[database]
path = "data/ada-dev.db"

[logging]
level = "DEBUG"
format = "console"

[model_routing]
default_profile = "local"

[model_routing.profiles.local]
provider = "openai_compat"
model = "crownelius/Crow-9B-Opus-4.6-Distill-Heretic_Qwen3.5:Q4_K_M"
base_url = "http://localhost:8080/v1"
max_tokens = 256
temperature = 0.7

[tts]
enabled = true
provider = "piper"

[multimodal]
enabled = true
voice_analysis_enabled = true
face_analysis_enabled = true
sensor_enabled = true
fusion_enabled = true
stt_enabled = true

[stt]
model_size = "base"

[model_routing.agent_mapping]
therapist = "local"
crisis_monitor = "local"
voice_emotion = "local"
facial_emotion = "local"
physiological = "local"
fusion = "local"
