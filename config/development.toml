[llm]
provider = "openai_compat"
model = "crownelius/Crow-9B-Opus-4.6-Distill-Heretic_Qwen3.5:Q4_K_M"
max_tokens = 2048
temperature = 0.7

[llm.claude]
api_key_env = "ANTHROPIC_API_KEY"

[llm.openai_compat]
base_url = "http://localhost:8080/v1"
api_key_env = "OPENAI_API_KEY"
model = "crownelius/Crow-9B-Opus-4.6-Distill-Heretic_Qwen3.5:Q4_K_M"

[agents.wellness_companion]
enabled = true

[agents.crisis_monitor]
enabled = true

[api]
host = "127.0.0.1"
port = 8000
cors_origins = ["http://localhost:5173", "http://localhost:3000"]

[database]
path = "data/ada-dev.db"

[logging]
level = "DEBUG"
format = "console"

[model_routing]
default_profile = "local"

[model_routing.profiles.local]
provider = "openai_compat"
model = "crownelius/Crow-9B-Opus-4.6-Distill-Heretic_Qwen3.5:Q4_K_M"
base_url = "http://localhost:8080/v1"
max_tokens = 2048
temperature = 0.7

[tts]
enabled = true
provider = "kokoro"

[multimodal]
enabled = true
voice_analysis_enabled = true
face_analysis_enabled = true
sensor_enabled = true
fusion_enabled = true
stt_enabled = true

[stt]
model_size = "large-v3-turbo"
language = "en"
compute_type = "float16"
min_confidence = 0.4
vad_filter = true
vad_threshold = 0.5

[agents.board_suggestion]
enabled = true
debounce_seconds = 5.0

# Development rate-limit overrides — intentionally generous.
# One caregiver account creation fires POST /register + POST /login + GET /me
# in sequence. With StrictMode double-mounting, a cold page load adds 2 more
# /me calls. Production defaults (10 auth/min, 120 api/min) are too tight for
# rapid iteration. These values stay in development.toml only; production.toml
# is unchanged (DEC-SEC-001).
[rate_limit]
auth_requests_per_minute = 60
api_requests_per_minute = 600

[model_routing.agent_mapping]
wellness_companion = "local"
crisis_monitor = "local"
voice_emotion = "local"
facial_emotion = "local"
physiological = "local"
fusion = "local"
board_suggestion = "local"
