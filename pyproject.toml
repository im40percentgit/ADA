[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ada"
version = "0.1.0"
description = "Ada — Multi-Agent Mental Health AI System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "aiosqlite>=0.19.0",
    "PyJWT>=2.12.0",
    "pwdlib[argon2]>=0.2.0",
    "python-multipart>=0.0.9",
    "librosa>=0.10",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
stt = [
    "faster-whisper>=1.0.0",
]
tts = [
    "piper-tts>=1.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
